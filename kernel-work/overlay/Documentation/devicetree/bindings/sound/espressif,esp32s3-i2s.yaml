%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/espressif,esp32s3-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 I2S controller

maintainers:
  - T-Deck Plus Linux port contributors

description: |
  The ESP32-S3 has two I2S controllers with AHB GDMA data paths. The T-Deck
  Plus uses I2S0 for MAX98357A playback and I2S1 for ES7210 four-slot TDM
  capture. GDMA descriptors must be provided from an internal-SRAM area
  reserved by the Core 0 firmware.

properties:
  compatible:
    const: espressif,esp32s3-i2s

  reg:
    maxItems: 1

  reg-names:
    items:
      - const: i2s

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: i2s
      - const: gdma

  resets:
    maxItems: 1

  reset-names:
    const: reset

  pinctrl-names:
    items:
      - const: default

  pinctrl-0:
    $ref: /schemas/types.yaml#/definitions/phandle-array

  espressif,gdma-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the shared GDMA register block.

  espressif,rx-tdm-slots:
    const: 4
    description: Four-slot TDM receive mode used by the ES7210.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - espressif,gdma-syscon
  - '#sound-dai-cells'

additionalProperties: false
